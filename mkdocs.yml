site_name: FOM.tft-timeseries — Dokumentation
site_description: Multi-Modell Time Series Forecasting mit TFT, ARIMA und Prophet

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list

nav:
  - 🏠 Übersicht: index.md

  - 🚀 Schnelleinstieg:
      - Script-Übersicht: shared/SCRIPTS.md
      - Projekt-Arbeitsweise: shared/ProjektArbeitsweise.md

  - 📊 Modelle:
      - TFT (Temporal Fusion Transformer):
          - Dataset TFT: project/DatasetTFT.md
          - Trainer TFT: project/TrainerTFT.md
          - Evaluation TFT: project/EvaluatorTFT.md
      - ARIMA:
          - Überblick: shared/ArimaIntegration.md
      - Prophet:
          - Integration: project/ProphetIntegration.md

  - 🎯 Hyperparameter-Optimierung (optional):
      - Optuna Übersicht: shared/Optuna.md

  - 🔄 Pipeline:
      - Pipeline Reihenfolge: shared/PipelineOrder.md

  - 📈 Visualisierung:
      - Überblick: shared/PlottingAndVisualization.md

  - 📁 Data Processing:
      - Datenqualität:
          - Analyze Dataset: project/AnalyzeDataset.md
          - Analyze Seasonal Peaks: project/AnalyzeSeasonalPeaks.md
      - Preprocessing:
          - Load Raw: project/LoadRaw.md
          - Data Alignment: project/DataAlignment.md
          - Data Cleaning: project/DataCleaning.md
          - Feature Engineering: project/FeatureEngineer.md
          - Cyclical Encoder: project/CyclicalEncoder.md
          - Lag Features: project/LagFeatures.md
      - Model-Spezifisch:
          - Model Dataset: project/ModelDataset.md

  - 📚 Allgemeine Dokumentation:
      - Projektstruktur: shared/Projektstruktur.md
      - Configs & Setup: shared/ConfigSetup.md
      - MkDocs Nutzung: shared/MkDocsUsage.md

plugins:
  - search:
      lang: de

extra:
  generator: false
