# configs/models/arima/walmart/baseline.yaml
# ARIMA Baseline-Konfiguration für Walmart

type: "arima"
name: "baseline"

model:
  # Auto-ARIMA (empfohlen für Anfang)
  # Findet automatisch beste (p,d,q) und (P,D,Q,m) Parameter
  auto_arima: true

  # Seasonal ARIMA bei Walmart
  # Walmart: 3050 Gruppen, wöchentliche Frequenz mit m=52
  # seasonal=true würde sehr lange dauern (Matrix-Operationen bei m=52)
  # seasonal=false ist ~12-15x schneller und erfasst Muster über höheres max_p
  seasonal: false

  # Auto-ARIMA Such-Parameter (nur wenn auto_arima: true)
  max_p: 5        # Erhöht (statt 3) um Jahres-Muster implizit zu erfassen
  max_q: 3        # Maximaler MA-Order
  max_d: 2        # Maximaler Differencing-Order

  # Seasonal Parameter (werden bei seasonal=false ignoriert)
  max_P: 2        # (ignored)
  max_Q: 2        # (ignored)
  max_D: 1        # (ignored)

  # Manuelle Parameter (nur wenn auto_arima: false)
  # order: [1, 1, 1]              # (p, d, q)
  # seasonal_order: [0, 0, 0, 0]  # Bei seasonal=false: keine seasonal terms

training:
  prediction_length: 4  # Forecast-Horizont (Wochen)

# ============================================================================
# HINWEISE (für Dokumentation):
# ============================================================================
#
# Parameter-Wahl:
# - p (AR): Anzahl vergangener Werte
# - d (I - Differencing): Für Stationarität (typisch 0-2)
# - q (MA): Anzahl vergangener Residuen
# - P, D, Q (Seasonal): Wie p,d,q aber für saisonale Komponente
# - m (Seasonal Period): Automatisch aus Frequenz (hier: 52)
#
# Seasonal bei Walmart:
# - 3050 Gruppen mit m=52 → seasonal ARIMA sehr rechenintensiv
# - seasonal=false reduziert Rechenzeit erheblich (~12-15x Speedup)
# - max_p=5 erlaubt AR-Terme, die langfristige Muster implizit erfassen können
# - Trade-off: Rechenzeit vs. explizite Seasonal-Modellierung
#
# Auto-ARIMA vs. Manual:
# - Auto: Langsamer aber findet beste Parameter
# - Manual: Schneller aber benötigt Domänenwissen
# - Empfehlung: Start mit auto, dann optional manuelle Fine-Tuning