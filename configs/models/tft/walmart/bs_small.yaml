# configs/models/tft/walmart/bs_small.yaml
# ============================================================================
# TFT Config: Kleine Batch-Size
# ============================================================================
# Test: Langsameres Training, aber mehr Updates pro Epoche
# Datum: 2025-11-23
# ============================================================================

type: "tft"
name: "bs_small"
description: "Experiment: Kleinere Batches für mehr Gradienten-Updates"

training:
  seed: 42
  max_epochs: 30
  batch_size: 64  # 4x kleiner als Baseline
  learning_rate: 0.001
  gradient_clip_val: 0.1
  early_stopping_patience: 5
  accelerator: "gpu"
  devices: 1
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

model:
  loss: "quantile"
  output_size: 7
  hidden_size: 32
  attention_head_size: 4
  hidden_continuous_size: 16
  dropout: 0.1
  reduce_on_plateau_patience: 2

evaluation:
  batch_size: 512
  num_workers: 0