# configs/models/tft/walmart/model_large.yaml
# ============================================================================
# TFT Config: Größeres Modell
# ============================================================================
# Test: Höhere Kapazität für komplexere Muster
# Datum: 2025-11-23
# ============================================================================

type: "tft"
name: "model_large"
description: "Experiment: 2x größeres Modell (hidden_size, hidden_continuous_size)"

training:
  seed: 42
  max_epochs: 30
  batch_size: 256
  learning_rate: 0.001
  gradient_clip_val: 0.1
  early_stopping_patience: 5
  accelerator: "gpu"
  devices: 1
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

model:
  target_normalizer_transformation: null
  loss: "quantile"
  output_size: 7
  hidden_size: 64  # 2x größer
  attention_head_size: 4
  hidden_continuous_size: 32  # 2x größer
  dropout: 0.1
  reduce_on_plateau_patience: 2

evaluation:
  batch_size: 512
  num_workers: 0