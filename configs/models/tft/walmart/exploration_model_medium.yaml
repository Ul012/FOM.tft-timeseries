# configs/models/tft/walmart/exploration_medium_model.yaml
#
# ============================================================================
# TFT Exploration: Medium Model Size
# ============================================================================

type: "tft"
name: "exploration_medium_model"
description: "TFT Exploration: Medium Model Size (hidden_size=32, 2× baseline)"

# ----------------------------------------------------------------------------
# Training-Hyperparameter
# ----------------------------------------------------------------------------
training:
  # Reproduzierbarkeit
  seed: 42

  # Epochen & Batching
  max_epochs: 30
  batch_size: 128

  # Optimizer
  learning_rate: 0.001
  gradient_clip_val: 0.1

  # Early Stopping
  early_stopping_patience: 5

  # Hardware
  accelerator: "cpu"  # bei GPU: "gpu"
  devices: 1

  # Dataloader
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

# ----------------------------------------------------------------------------
# Modell-Architektur (TFT-spezifisch)
# ----------------------------------------------------------------------------
model:
  loss: "quantile"
  output_size: 7  # 7 Quantile für probabilistische Vorhersagen

  # Netzwerk-Größe (2× baseline: 16 → 32)
  hidden_size: 32
  attention_head_size: 4
  hidden_continuous_size: 16  # 2:1 Ratio beibehalten

  # Regularisierung
  dropout: 0.1

  # Learning Rate Scheduler
  reduce_on_plateau_patience: 2

# ----------------------------------------------------------------------------
# Evaluation-Parameter (optional, für evaluate_tft.py)
# ----------------------------------------------------------------------------
evaluation:
  batch_size: 256  # größer als Training (kein Gradient)
  num_workers: 0

# Exploration: Testen ob größeres Modell bessere Performance liefert