# configs/models/tft/walmart/lr_high.yaml
# ============================================================================
# TFT Config: Hohe Learning Rate
# ============================================================================
# Test: Schnellere Konvergenz vs. Stabilität
# Datum: 2025-11-23
# ============================================================================

type: "tft"
name: "lr_high"
description: "Experiment: 10x höhere Learning Rate"

training:
  seed: 42
  max_epochs: 30
  batch_size: 256
  learning_rate: 0.01  # 10x höher als Baseline
  gradient_clip_val: 0.1
  early_stopping_patience: 5
  accelerator: "gpu"
  devices: 1
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

model:
  target_normalizer_transformation: null
  loss: "quantile"
  output_size: 7
  hidden_size: 32
  attention_head_size: 4
  hidden_continuous_size: 16
  dropout: 0.1
  reduce_on_plateau_patience: 2

evaluation:
  batch_size: 512
  num_workers: 0