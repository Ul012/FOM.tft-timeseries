# configs/models/tft/walmart/exploration_lr_low.yaml
#
# ============================================================================
# TFT Exploration: Lower Learning Rate
# ============================================================================

type: "tft"
name: "exploration_lr_low"
description: "TFT Exploration: Lower Learning Rate (lr=0.0003, 0.3× baseline)"

# ----------------------------------------------------------------------------
# Training-Hyperparameter
# ----------------------------------------------------------------------------
training:
  # Reproduzierbarkeit
  seed: 42

  # Epochen & Batching
  max_epochs: 30
  batch_size: 128

  # Optimizer (0.3× baseline: 0.001 → 0.0003)
  learning_rate: 0.0003
  gradient_clip_val: 0.1

  # Early Stopping
  early_stopping_patience: 5

  # Hardware
  accelerator: "cpu"  # bei GPU: "gpu"
  devices: 1

  # Dataloader
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

# ----------------------------------------------------------------------------
# Modell-Architektur (TFT-spezifisch)
# ----------------------------------------------------------------------------
model:
  loss: "quantile"
  output_size: 7  # 7 Quantile für probabilistische Vorhersagen

  # Netzwerk-Größe (baseline)
  hidden_size: 16
  attention_head_size: 4
  hidden_continuous_size: 8

  # Regularisierung
  dropout: 0.1

  # Learning Rate Scheduler
  reduce_on_plateau_patience: 2

# ----------------------------------------------------------------------------
# Evaluation-Parameter (optional, für evaluate_tft.py)
# ----------------------------------------------------------------------------
evaluation:
  batch_size: 256  # größer als Training (kein Gradient)
  num_workers: 0

# Exploration: Niedrigere LR → stabileres Training → potentiell besseres Optimum