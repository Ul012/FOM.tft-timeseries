# configs/models/tft/baseline.yaml
# ============================================================================
# TFT Baseline-Konfiguration
# ============================================================================
# Stabile Referenzkonfiguration für Temporal Fusion Transformer
# Datum: 2025-11-21
# Basiert auf: trainer_tft_baseline02.yaml
#
# Diese Config ist für Pipeline-Orchestrierung optimiert.
# ============================================================================

type: "tft"
name: "baseline_v02"
description: "Stabile Referenz für TFT - mittlere Modellgröße, 30 Epochen"

# ----------------------------------------------------------------------------
# Training-Hyperparameter
# ----------------------------------------------------------------------------
training:
  # Reproduzierbarkeit
  seed: 42

  # Epochen & Batching
  max_epochs: 30
  batch_size: 32  # ← 4x kleiner

  # Optimizer
  learning_rate: 0.001
  gradient_clip_val: 0.1

  # Early Stopping
  early_stopping_patience: 5

  # Hardware
  accelerator: "gpu"  # bei GPU: "gpu"
  devices: 1

  # Dataloader
  num_workers: 4
  limit_train_batches: 1.0
  limit_val_batches: 1.0

# ----------------------------------------------------------------------------
# Modell-Architektur (TFT-spezifisch)
# ----------------------------------------------------------------------------
model:
  loss: "quantile"
  output_size: 7  # 7 Quantile für probabilistische Vorhersagen

  # Netzwerk-Größe
  hidden_size: 32
  attention_head_size: 4
  hidden_continuous_size: 16

  # Regularisierung
  dropout: 0.1

  # Learning Rate Scheduler
  reduce_on_plateau_patience: 2

# ----------------------------------------------------------------------------
# Evaluation-Parameter (optional, für evaluate_tft.py)
# ----------------------------------------------------------------------------
evaluation:
  batch_size: 256  # größer als Training (kein Gradient)
  num_workers: 0