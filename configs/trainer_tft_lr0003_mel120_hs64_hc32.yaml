# Experiment: Baseline-Konfiguration für Temporal Fusion Transformer (TFT)
# Ziel: stabile, reproduzierbare Referenz für spätere Hyperparameter-Studien
# Datum: 2025-11-16
# Version: v01_baseline

# Reproduzierbarkeit
seed: 42
accelerator: "gpu"        # bei GPU: "gpu"
devices: 1

# ----------------------------
# Trainer-Konfiguration
# ----------------------------
max_epochs: 30
batch_size: 128           # unverändert (funktioniert gut)
learning_rate: 0.003      # REDUZIERT: 0.01 → 0.003 (stabilerer Abstieg)
gradient_clip_val: 0.1
early_stopping_patience: 7  # ERHÖHT: 5 → 7 (mehr Geduld für niedrigere LR)
num_workers: 4
limit_train_batches: 1.0
limit_val_batches: 1.0

# ----------------------------
# Modellparameter (TFT)
# ----------------------------
model:
  loss: "quantile"
  hidden_size: 64             # VERDOPPELT: 32 → 64 (mehr Kapazität)
  attention_head_size: 4      # unverändert
  dropout: 0.15               # ERHÖHT: 0.1 → 0.15 (mehr Regularisierung)
  hidden_continuous_size: 32  # VERDOPPELT: 16 → 32 (proportional zu hidden_size)
  output_size: 7
  reduce_on_plateau_patience: 3  # ERHÖHT: 2 → 3 (mehr Geduld)