name: "walmart"
description: "Walmart Store Sales - Weekly forecasting (Kaggle)"

# ----------------------------------------------------------------------------
# Pfade (relativ zu BASE_DIR)
# ----------------------------------------------------------------------------
paths:
  raw: "data/raw/walmart"
  interim: "data/interim/walmart"
  processed: "data/processed/walmart"

# ----------------------------------------------------------------------------
# Raw Data Loading (Walmart braucht Merge von 2 Dateien)
# ----------------------------------------------------------------------------
raw_data:
  type: "multiple_files"  # "single_file" oder "multiple_files"
  # Für multiple_files:
  files:
    - path: "data/raw/walmart/train.csv"
      role: "main"
      columns: ["Store", "Dept", "Date", "Weekly_Sales", "IsHoliday"]
    - path: "data/raw/walmart/features.csv"
      role: "features"
      columns: ["Store", "Date", "Temperature", "Fuel_Price", "MarkDown1", "MarkDown2", "MarkDown3", "MarkDown4", "MarkDown5", "CPI", "Unemployment", "IsHoliday"]
  merge:
    merge_on: ["Store", "Date"]
    how: "left"
    drop_from_right:
      - "IsHoliday"

# ----------------------------------------------------------------------------
# Schema (Dataset-spezifisch)
# ----------------------------------------------------------------------------
schema:
  time_col: "Date"  # Achtung: Großschreibung bei Walmart!
  id_cols: ["Store", "Dept"]
  target_col: "Weekly_Sales"

# ----------------------------------------------------------------------------
# Preprocessing-Pipeline (Reihenfolge wichtig!)
# ----------------------------------------------------------------------------
preprocessing:
  - step: "load_raw"
    enabled: true
    description: "Merged train.csv + features.csv"
    params: {}

  - step: "alignment"
    enabled: false  # Walmart braucht keine Skalierung auf Referenzjahr
    description: "Nicht benötigt für Walmart"
    params: {}

  - step: "cleaning"
    enabled: true
    description: "Bereinigt Ausreißer (KEIN Lockdown bei Walmart)"
    params:
      clip_target_min: 0  # Werte unter diesem Minimum werden auf diesen Wert gesetzt (0 = keine negativen Sales)
      remove_nan: true    # NaN im Target entfernen
      outlier_dates: []   # Keine bekannten Outlier-Dates
      # KEIN lockdown_start/lockdown_end bei Walmart!

  - step: "feature_engineering"
    enabled: true
    description: "Kalender-Features, time_idx, US-Feiertage"
    params:
      country: "US"  # Für Feiertage (Super Bowl, Thanksgiving, etc.)
      include_holiday_name: true  # IsHoliday-Namen als Feature

      date_flags: {}  # Keine Custom Flags nötig - IsHoliday ist in CSV

  - step: "cyclical_encoder"
    enabled: true
    description: "Zyklische Sin/Cos-Kodierung"
    params:
      periodicities:
        week: ["week", 52]  # Wöchentliche Daten!
        month: ["month", 12]

  - step: "lag_features"
    enabled: true
    description: "Lag- und Rolling-Features (angepasst für wöchentlich)"
    params:
      min_group_length: 30   # Gruppen mit weniger Zeitschritten werden entfernt
      lags: [1, 4, 8]        # Wochen statt Tage! (1W, 1M, 2M)
      roll_windows: [4, 8]      # 4 Wochen = ~1 Monat, 8 Wochen = ~2 Monate
      roll_stats: ["mean"]
      prefix: "lag_"

# ----------------------------------------------------------------------------
# Split-Konfiguration (zeitbasiert)
# ----------------------------------------------------------------------------
split:
  method: "ratio"
  ratios: [0.70, 0.15, 0.15] # wieder zurück auf ratio statt fixed: dann wird ratio auf jede Gruppe angewendet. Bei fixed nicht.
  # val_start: "2011-10-28"  # 20 Wochen für Val
  # test_start: "2012-03-30"  # 30 Wochen für Test
  scale_cols: []  # Optional: Spalten für MinMax-Skalierung

# ----------------------------------------------------------------------------
# TFT-spezifische Parameter
# ----------------------------------------------------------------------------
tft:
  # Sequenz-Längen
  max_encoder_length: 24  # für Optuna walmart_full: 16. # Historie die das Modell sieht (~6 Monate bei wöchentlich)
  max_prediction_length: 4  # Forecast-Horizont (~1 Monate)

  # Feature-Klassifikation (basierend auf Spalten-Prefixes)
  known_real_prefixes: ["cyc_"]  # Bekannte kontinuierliche Features
  lag_prefixes: ["lag_"]          # Lag-Features (werden als unknown behandelt)

  # Kalender-Features als "known" behandeln
  treat_calendar_as_known: true

  # Explizite Flag-Spalten (binär)
  flag_cols: ["IsHoliday"]  # Keine Lockdown-Flag bei Walmart

  # MarkDown-Features: NaN = keine Promotion → mit 0 imputen
  impute_cols:
    MarkDown1: 0.0
    MarkDown2: 0.0
    MarkDown3: 0.0
    MarkDown4: 0.0
    MarkDown5: 0.0

  # lag_365 nur bei täglichen Daten sinnvoll (Booksales)
  # Walmart: wöchentliche Daten → ausschließen
  exclude_cols: [ "lag_365" ]

# ----------------------------------------------------------------------------
# Prophet-spezifische Parameter
# ----------------------------------------------------------------------------
prophet:
  regressors:
    # Kalender
    - "month"
    - "weekofyear"
    - "is_weekend"

    # Feiertage
    - "IsHoliday"

    # Externe Regressoren
    - "Temperature"
    - "Fuel_Price"
    - "CPI"
    - "Unemployment"
    - "MarkDown1"
    - "MarkDown2"
    - "MarkDown3"
    - "MarkDown4"
    - "MarkDown5"

  country_holidays: "US"
  growth: "linear"
  seasonality_mode: "multiplicative"
  prediction_length: 4

arima:
  exog_vars:
    - "IsHoliday"      # Sehr wichtig für Peak-Prediction
    - "Temperature"    # Wetter-Einfluss
    - "Fuel_Price"     # Ökonomischer Indikator

  # Automatische Parametersuche
  # true = auto_arima findet beste (p,d,q) und (P,D,Q,m)
  # false = Manuelle Parameter aus order/seasonal_order
  auto_arima: true

  # Forecast-Horizont
  prediction_length: 4  # Wochen

  # Manuelle Parameter (nur wenn auto_arima: false)
  order: [1, 1, 1]               # (p, d, q)
  seasonal_order: [1, 1, 1, 52]  # (P, D, Q, m) - m=52 für wöchentliche Daten